name: Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with docs dependencies
        run: pip install -e ".[docs]"

      - name: Build HTML docs
        run: python -m sphinx docs docs/_build/html -b html -W --keep-going

      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Stage docs to gh-pages
        run: |
          # Clear previous build output, preserving the .git directory
          find gh-pages -mindepth 1 -not -path 'gh-pages/.git*' -delete
          cp -r docs/_build/html/. gh-pages/
          # Ensure GitHub Pages does not run Jekyll (which strips _static etc.)
          touch gh-pages/.nojekyll

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit \
            -m "docs: deploy $(git -C .. rev-parse --short HEAD) [skip ci]"
          git push origin gh-pages
